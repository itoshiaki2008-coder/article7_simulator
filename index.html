 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.iv)},key,u(P.ct)));}
function open(h,exp){var r=Math.max(1000,exp-Date.now());
 h=h.replace(/<head[^>]*>/i,function(m){return m+"<script>setTimeout(function(){try{sessionStorage.removeItem(\""+K+"\")}catch(e){}location.reload()},"+r+")<\/script>";});
 document.open();document.write(h);document.close();}
function saved(){try{var o=JSON.parse(sessionStorage.getItem(K)||"null");return o&&o.e>Date.now()?o:null;}catch(e){return null;}}
var bx=document.getElementById("bx"),pw=document.getElementById("pw"),er=document.getElementById("er"),go=document.getElementById("go"),fails=0,wait=0;
async function tryOpen(p,fresh){
 try{var h=await dec(p);var s=saved();var exp=(!fresh&&s)?s.e:Date.now()+TTL;
  try{sessionStorage.setItem(K,JSON.stringify({p:p,e:exp}));}catch(e){}
  open(h,exp);return true;}catch(e){return false;}}
async function submit(){
 if(Date.now()<wait){er.textContent="しばらくしてからもう一度お試しください。";return;}
 go.disabled=true;er.textContent="確認中…";
 var ok=await tryOpen(pw.value,true);
 if(!ok){fails++;pw.value="";er.textContent="パスフレーズが違います。";if(fails>=5){wait=Date.now()+30000;fails=0;er.textContent="5回失敗しました。30秒お待ちください。";}}
 go.disabled=false;}
go.onclick=submit;pw.onkeydown=function(e){if(e.key==="Enter")submit();};
(async function(){var s=saved();if(s&&await tryOpen(s.p,false))return;bx.hidden=false;pw.focus();})();
})();
