<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小型船舶安全規則 第7条 航行区域シミュレーター</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Share+Tech+Mono&display=swap');
  :root {
    --navy:#0a1628; --navy-mid:#112240; --steel:#2a5298;
    --cyan:#00c8e0; --green:#2ecc71; --red:#e74c3c; --orange:#f39c12;
    --text:#cdd6e8; --text-dim:#6a8099; --border:rgba(0,200,224,0.2);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--navy);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;padding:20px;}
  header{text-align:center;padding:28px 20px 20px;border-bottom:1px solid var(--border);margin-bottom:24px;position:relative;}
  header::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60px;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);}
  .header-sub{font-size:11px;letter-spacing:.2em;color:var(--cyan);font-family:'Share Tech Mono',monospace;margin-bottom:6px;}
  header h1{font-size:clamp(15px,4vw,21px);font-weight:700;color:#fff;}
  header p{font-size:12px;color:var(--text-dim);margin-top:6px;}
  .container{max-width:780px;margin:0 auto;}
  .sec-title{font-size:10px;letter-spacing:.18em;color:var(--cyan);font-family:'Share Tech Mono',monospace;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .sec-title::after{content:'';flex:1;height:1px;background:var(--border);}
  .card{background:var(--navy-mid);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:14px;}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--text-dim);}
  .field label .unit{color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:10px;margin-left:3px;}
  .field input,.field select{background:var(--navy);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:13px;padding:6px 9px;width:100%;outline:none;transition:border-color .2s;}
  .field input:focus,.field select:focus{border-color:var(--cyan);}
  .field select option{background:var(--navy-mid);}
  .field input:disabled{opacity:.3;cursor:not-allowed;}
  .unit-toggle{display:flex;gap:4px;margin-top:2px;}
  .unit-btn{flex:1;padding:4px 0;font-size:11px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text-dim);cursor:pointer;font-family:'Share Tech Mono',monospace;transition:all .15s;}
  .unit-btn.active{background:var(--cyan);border-color:var(--cyan);color:var(--navy);font-weight:700;}
  .calc-display{background:var(--navy);border:1px solid var(--border);border-radius:5px;padding:9px 13px;font-family:'Share Tech Mono',monospace;font-size:11.5px;color:var(--text-dim);margin-bottom:12px;min-height:32px;line-height:1.85;}
  .calc-display .val{color:var(--cyan);} .calc-display .ok{color:var(--green);} .calc-display .ng{color:var(--red);}
  .calc-display .dim{color:var(--text-dim);font-size:10.5px;}
  .btn-judge{width:100%;padding:13px;background:linear-gradient(135deg,var(--steel),#1a4a8a);border:1px solid var(--cyan);border-radius:6px;color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:all .2s;}
  .btn-judge:hover{box-shadow:0 0 18px rgba(0,200,224,.28);}
  #result-panel{display:none;margin-top:20px;}
  .rzone{border-radius:8px;padding:16px 18px;margin-bottom:12px;border-left:4px solid transparent;position:relative;overflow:hidden;}
  .rzone::before{content:'';position:absolute;inset:0;opacity:.07;}
  .rz-ok{border-color:var(--green);background:rgba(46,204,113,.08);} .rz-ok::before{background:var(--green);}
  .rz-ng{border-color:var(--red);background:rgba(231,76,60,.08);} .rz-ng::before{background:var(--red);}
  .rz-warn{border-color:var(--orange);background:rgba(243,156,18,.08);} .rz-warn::before{background:var(--orange);}
  .rz-label{font-size:10px;letter-spacing:.14em;font-family:'Share Tech Mono',monospace;opacity:.65;margin-bottom:5px;}
  .rz-title{font-size:17px;font-weight:700;margin-bottom:3px;}
  .rz-ok .rz-title{color:var(--green);} .rz-ng .rz-title{color:var(--red);} .rz-warn .rz-title{color:var(--orange);}
  .rz-desc{font-size:12.5px;color:var(--text);line-height:1.6;margin-bottom:8px;}
  .cond-list{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
  .crow{display:flex;align-items:flex-start;gap:7px;font-size:12px;padding:4px 7px;border-radius:3px;background:rgba(255,255,255,.03);}
  .crow .ci{flex-shrink:0;font-size:12px;margin-top:1px;} .crow .ct{line-height:1.55;}
  .sub-section{margin-top:10px;padding:10px 12px;background:rgba(0,0,0,.2);border-radius:5px;border-left:2px solid var(--border);}
  .sub-section-title{font-size:10px;color:var(--cyan);letter-spacing:.1em;font-family:'Share Tech Mono',monospace;margin-bottom:7px;}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .badge{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid;}
  .b-ok{background:rgba(46,204,113,.15);border-color:var(--green);color:var(--green);}
  .b-ng{background:rgba(231,76,60,.1);border-color:rgba(231,76,60,.3);color:rgba(231,76,60,.55);text-decoration:line-through;}
  .b-cond{background:rgba(243,156,18,.12);border-color:var(--orange);color:var(--orange);}
  .note{font-size:11px;color:var(--text-dim);margin-top:10px;line-height:1.65;padding:7px 10px;border-left:2px solid var(--border);}
</style>
</head>
<body>
<div class="container">

<header>
  <div class="header-sub">JCI SIMULATOR — ARTICLE 7</div>
  <h1>小型船舶安全規則 第7条<br>航行区域シミュレーター</h1>
  <p>船舶の諸元を入力し、適用可能な航行区域を判定します</p>
</header>

<!-- ══ 基本諸元 ══ -->
<div class="sec-title">基本諸元</div>
<div class="card">
  <div class="grid">
    <div class="field"><label>船の長さ L<span class="unit">m</span></label>
      <input type="number" id="L" min="0" step="0.1" placeholder="例: 4.5" oninput="onChange()"></div>
    <div class="field"><label>船の幅 B<span class="unit">m</span></label>
      <input type="number" id="B" min="0" step="0.1" placeholder="例: 1.8" oninput="onChange()"></div>
    <div class="field"><label>最大搭載人員 N<span class="unit">人</span></label>
      <input type="number" id="N" min="1" step="1" placeholder="例: 4" oninput="onChange()"></div>
    <div class="field"><label>乾舷 F1<span class="unit">m</span></label>
      <input type="number" id="F1" min="0" step="0.001" placeholder="例: 0.450" oninput="onChange()"></div>
    <div class="field"><label>げん幅 b<span class="unit">m（省略可→B/2）</span></label>
      <input type="number" id="b_inp" min="0" step="0.01" placeholder="省略時 B/2" oninput="onChange()"></div>
    <div class="field"><label>最強速力<span class="unit">kt</span></label>
      <input type="number" id="spd" min="0" step="0.1" placeholder="例: 18" oninput="onChange()"></div>
    <div class="field"><label>推進方式</label>
      <select id="drive" onchange="onChange()">
        <option value="inboard">船内機 / 船内外機</option>
        <option value="outboard">船外機</option>
      </select></div>
    <div class="field" id="f-eng"><label>船外機台数<span class="unit">台</span></label>
      <input type="number" id="eng" min="1" step="1" placeholder="例: 2" oninput="onChange()"></div>
  </div>
</div>

<!-- ══ 甲板条件 ══ -->
<div class="sec-title">甲板条件（2時間限定沿海）</div>
<div class="card">
  <div class="grid-2">
    <div class="field"><label>甲板種別</label>
      <select id="deck" onchange="onChange()">
        <option value="none">甲板なし</option>
        <option value="full">全通甲板あり</option>
        <option value="bow">船首甲板のみ</option>
      </select></div>
    <div class="field" id="f-bowlen"><label>船首甲板の長さ<span class="unit">m</span></label>
      <input type="number" id="bowlen" min="0" step="0.01" placeholder="例: 0.85" oninput="onChange()"></div>
  </div>
</div>

<!-- ══ コーミング・舷弧・出力 ══ -->
<div class="sec-title">コーミング・全沿海(2)専用条件</div>
<div class="card">
  <div class="grid">
    <div class="field"><label>コーミング高さ（実測）<span class="unit">mm</span></label>
      <input type="number" id="coaming" min="0" step="1" placeholder="例: 155" oninput="onChange()"></div>
    <div class="field"><label>前部舷弧 Sf<span class="unit">mm</span></label>
      <input type="number" id="Sf" min="0" step="1" placeholder="例: 50" oninput="onChange()"></div>
    <div class="field"><label>後部舷弧 Sa<span class="unit">mm</span></label>
      <input type="number" id="Sa" min="0" step="1" placeholder="例: 25" oninput="onChange()"></div>
    <div class="field">
      <label>主機出力<span class="unit" id="pw-unit-lbl">kW</span></label>
      <input type="number" id="pw" min="0" step="0.1" placeholder="例: 55" oninput="onChange()">
      <div class="unit-toggle">
        <button class="unit-btn active" id="btn-kw" onclick="setUnit('kw')">kW</button>
        <button class="unit-btn" id="btn-ps" onclick="setUnit('ps')">PS</button>
      </div>
    </div>
    <div class="field"><label>燃料搭載量<span class="unit">kL</span></label>
      <input type="number" id="fuel" min="0" step="0.001" placeholder="例: 0.150" oninput="onChange()"></div>
  </div>
</div>

<!-- 計算表示 -->
<div class="calc-display" id="calc-display">— 数値を入力すると計算値が表示されます —</div>
<button class="btn-judge" onclick="judge()">⚓ 航行区域を判定する</button>

<!-- ══ 結果 ══ -->
<div id="result-panel">
  <div class="sec-title" style="margin-top:22px;">判定結果</div>
  <div id="result-content"></div>
</div>

</div><!-- /container -->
<script>
// ══ ユーティリティ ══
function pf(id){return parseFloat(document.getElementById(id).value);}
function ok(v){return !isNaN(v);}
function clamp0(v){return v<0?0:v;}  // ()内が負数→0

// ══ コーミング必要値計算 ══
// type: 'zone1'(係数75/30L) or 'zone3_1'(係数150/75/30L)
// 分岐: 0.07L>0.25B → 70L式, else → 250B式
function calcCoamReq(L, B, Fmm, type) {
  if (!ok(L)||!ok(B)||!ok(Fmm)) return {req:NaN, branch:'', inner:NaN};
  const base  = type==='zone1' ? 75  : 150;
  const coef  = type==='zone1' ? 37.5: 75;
  const useLbranch = 0.07*L > 0.25*B;
  let inner, branch;
  if (useLbranch) {
    inner = Fmm - 70*L;
    branch = `0.07L(${(0.07*L).toFixed(1)}) > 0.25B(${(0.25*B).toFixed(1)}) → 70L式`;
  } else {
    inner = Fmm - 250*B;
    branch = `0.07L(${(0.07*L).toFixed(1)}) ≤ 0.25B(${(0.25*B).toFixed(1)}) → 250B式`;
  }
  const innerC = clamp0(inner);
  const req = base - (coef/(30*L))*innerC;
  return {req, branch, inner, innerC};
}

// ══ 単位切替 ══
let pwUnit='kw';
function setUnit(u){
  pwUnit=u;
  document.getElementById('btn-kw').classList.toggle('active',u==='kw');
  document.getElementById('btn-ps').classList.toggle('active',u==='ps');
  document.getElementById('pw-unit-lbl').textContent=u==='kw'?'kW':'PS';
  onChange();
}
function getPSkW(){
  const v=pf('pw'); if(!ok(v)) return {PS:NaN,kW:NaN};
  return pwUnit==='kw'?{kW:v,PS:v/0.7355}:{PS:v,kW:v*0.7355};
}

// ══ フィールド表示制御 ══
function onChange(){
  const drive=document.getElementById('drive').value;
  const deck=document.getElementById('deck').value;
  document.getElementById('f-eng').style.opacity=drive==='outboard'?'1':'0.3';
  document.getElementById('eng').disabled=drive!=='outboard';
  const showBow=deck==='bow';
  document.getElementById('f-bowlen').style.opacity=showBow?'1':'0.3';
  document.getElementById('bowlen').disabled=!showBow;
  updateCalc();
}

// ══ リアルタイム計算表示 ══
function updateCalc(){
  const L=pf('L'),B=pf('B'),N=pf('N'),F1=pf('F1');
  const bIn=pf('b_inp'),bowLen=pf('bowlen');
  const deck=document.getElementById('deck').value;
  const {PS}=getPSkW(), Sf=pf('Sf'),Sa=pf('Sa');
  const Fmm=ok(F1)?F1*1000:NaN;
  const d=document.getElementById('calc-display');
  let lines=[];

  if (ok(L)&&L>0) {
    const alpha=0.042/(0.05*L+0.07),alphaL=alpha*L;
    lines.push(`α=${alpha.toFixed(4)}　αL=<span class="val">${alphaL.toFixed(3)}m</span>　0.13L=<span class="val">${(0.13*L).toFixed(3)}m</span>`);
    if (deck==='bow'&&ok(bowLen)) {
      const okA=bowLen>alphaL,okB=bowLen>0.13*L;
      lines.push(`船首甲板${bowLen}m　vs αL${alphaL.toFixed(3)}m→<span class="${okA?'ok':'ng'}">${okA?'✓':'✗'}</span>　vs 0.13L${(0.13*L).toFixed(3)}m→<span class="${okB?'ok':'ng'}">${okB?'✓':'✗'}</span>`);
    }
    if (ok(B)) {
      const b=ok(bIn)&&bIn>0?bIn:B/2;
      const f=Math.max(0.03*L,0.24*b);
      lines.push(`f=max(3%L=${(0.03*L).toFixed(3)},24%b=${(0.24*b).toFixed(3)})=<span class="val">${f.toFixed(3)}m</span>`);
      if (ok(N)&&ok(F1)){
        const F1r=0.096*N/(L*B)+f,F1ok=F1>=F1r;
        lines.push(`F1必要値=${F1r.toFixed(4)}m 実際F1=${F1}m→<span class="${F1ok?'ok':'ng'}">${F1ok?'✓充足':'✗不足'}</span>`);
      }
      // コーミング必要値（ZONE1）
      if (ok(Fmm)) {
        const r1=calcCoamReq(L,B,Fmm,'zone1');
        lines.push(`コーミング必要値[ZONE1]=<span class="val">${r1.req.toFixed(1)}mm</span> <span class="dim">${r1.branch}${r1.inner<0?' (括弧内→0)':''}</span>`);
        const r3=calcCoamReq(L,B,Fmm,'zone3_1');
        lines.push(`コーミング必要値[全沿海(1)]=<span class="val">${r3.req.toFixed(1)}mm</span> <span class="dim">${r3.branch}${r3.inner<0?' (括弧内→0)':''}</span>`);
        // ZONE3(2)d
        if (ok(B)){
          const coam2dInner=clamp0(Fmm-250*B);
          const coam2d=225-(112.5/(50*B))*coam2dInner;
          lines.push(`コーミング必要値[全沿海(2)d]=<span class="val">${coam2d.toFixed(1)}mm</span>`);
        }
      }
    }
  }
  if (ok(Sf)&&ok(Sa)){
    const fb=43+(13-12.38*(Sf+Sa));
    lines.push(`乾舷必要値[全沿海(2)b]=<span class="val">${fb.toFixed(2)}mm</span>`);
  }
  if (ok(PS)){
    const fuelR=180*10*PS/(1e6*0.84)/1000;
    lines.push(`燃料必要量[全沿海(2)c]=<span class="val">${fuelR.toFixed(4)}kL</span>`);
  }
  d.innerHTML=lines.length?lines.join('<br>'):'— 数値を入力すると計算値が表示されます —';
}

// ══ 判定メイン ══
function judge(){
  const L=pf('L'),B=pf('B'),N=pf('N'),F1=pf('F1'),spd=pf('spd');
  const drive=document.getElementById('drive').value;
  const engN=parseInt(document.getElementById('eng').value);
  const bIn=pf('b_inp'),bowLen=pf('bowlen');
  const deck=document.getElementById('deck').value;
  const {PS}=getPSkW(),fuel=pf('fuel'),Sf=pf('Sf'),Sa=pf('Sa'),coaming=pf('coaming');

  if (!ok(L)||!ok(B)||!ok(N)||!ok(F1)||!ok(spd)){
    alert('L / B / N / F1 / 最強速力 は必須入力です。');return;
  }

  const b=ok(bIn)&&bIn>0?bIn:B/2;
  const alpha=0.042/(0.05*L+0.07),alphaL=alpha*L;
  const f=Math.max(0.03*L,0.24*b);
  const F1_req=0.096*N/(L*B)+f;
  const Fmm=F1*1000;

  // ── 甲板 ──
  let deckOk_alpha=false,deckOk_13=false;
  if (deck==='full'){deckOk_alpha=true;deckOk_13=true;}
  else if (deck==='bow'&&ok(bowLen)){deckOk_alpha=bowLen>alphaL;deckOk_13=bowLen>0.13*L;}

  // ── コーミング ──
  const r_z1  = calcCoamReq(L,B,Fmm,'zone1');
  const r_z3_1= calcCoamReq(L,B,Fmm,'zone3_1');
  const coam2dInner = clamp0(Fmm-250*B);
  const coam2d_req  = ok(F1)&&ok(B) ? 225-(112.5/(50*B))*coam2dInner : NaN;

  const coam_ok_z1   = ok(coaming)&&ok(r_z1.req)   && coaming>=r_z1.req;
  const coam_ok_z3_1 = ok(coaming)&&ok(r_z3_1.req) && coaming>=r_z3_1.req;
  const coam_ok_z3_2d= ok(coaming)&&ok(coam2d_req) && coaming>=coam2d_req;

  // ─────────────────
  // ZONE 1: 陸岸5海里
  // ─────────────────
  // L<5m かつ コーミング条件
  const zone1_L   = L<5;
  const zone1_ok  = zone1_L && coam_ok_z1;

  // ─────────────────
  // ZONE 2: 2時間限定沿海
  // ─────────────────
  let zone2_ok=false,zone2_rows='',zone2_desc='';
  if (L<5){
    const c1=deckOk_alpha, c2=F1>=F1_req;
    zone2_ok=c1&&c2;
    let dd='';
    if (deck==='full') dd='全通甲板あり ✓';
    else if (deck==='bow') dd=`船首甲板${ok(bowLen)?bowLen:'?'}m ${deckOk_alpha?'>':'≤'} αL${alphaL.toFixed(3)}m → ${deckOk_alpha?'✓':'✗'}`;
    else dd='甲板なし ✗';
    zone2_rows  = crow(c1,`【条件1 甲板】${dd}`);
    zone2_rows += crow(c2,`【条件2 乾舷】F1必要値=${F1_req.toFixed(4)}m 実際F1=${F1}m → ${c2?'充足 ✓':'不足 ✗'}<br><span style="font-size:10.5px;color:var(--text-dim)">= 0.096×${N}/(${L}×${B})+max(3%L,24%b)</span>`);
    zone2_desc=zone2_ok?'2時間以内の往復を条件に限定沿海を航行できます。':'条件1・2の両方を満たす必要があります。';
  } else {
    if (deck==='full') zone2_ok=true;
    else if (deck==='bow') zone2_ok=deckOk_13;
    let dd2='';
    if (deck==='full') dd2='全通甲板あり ✓';
    else if (deck==='bow') dd2=`船首甲板${ok(bowLen)?bowLen:'?'}m ${deckOk_13?'>':'≤'} 0.13L${(0.13*L).toFixed(3)}m → ${deckOk_13?'✓':'✗'}`;
    else dd2='甲板なし ✗';
    zone2_rows=crow(zone2_ok,`【甲板条件】${dd2}`);
    zone2_desc=zone2_ok?'2時間以内の往復を条件に限定沿海を航行できます。':'甲板条件を満たす必要があります。';
  }

  // ─────────────────
  // ZONE 3: 全沿海
  // ─────────────────
  const cond_eng2=drive==='outboard'?(!isNaN(engN)&&engN>=2):true;
  // (1) 14kt以上 + コーミング
  const c_spd14=spd>=14;
  const zone3_1_ok=c_spd14&&coam_ok_z3_1;
  // (2) 14kt未満 a~d
  const c_spd6  =spd>=6;
  const fuelReq =ok(PS)?180*10*PS/(1e6*0.84)/1000:NaN;
  const c_fuel  =ok(fuel)&&ok(fuelReq)&&fuel>=fuelReq;
  const F1b_req =ok(Sf)&&ok(Sa)?(43+(13-12.38*(Sf+Sa)))/1000:NaN; // m
  const c_F1b   =ok(F1)&&ok(F1b_req)&&F1>=F1b_req;
  const zone3_2_ok=!c_spd14&&cond_eng2&&c_spd6&&c_fuel&&c_F1b&&coam_ok_z3_2d;
  const zone3_ok=cond_eng2&&(zone3_1_ok||zone3_2_ok);

  // ══ 結果HTML ══
  const panel=document.getElementById('result-panel');
  const content=document.getElementById('result-content');
  panel.style.display='block';
  let html='';

  // — ZONE 3 全沿海 —
  {
    let rows='';
    // 船外機共通
    if (drive==='outboard') rows+=crow(cond_eng2,`船外機台数=${isNaN(engN)?'未入力':engN}台 → ${cond_eng2?'2台以上 ✓':'2台未満（全沿海不可）'}`);
    else rows+=crow(true,'船内機/船内外機 → 台数条件なし ✓');

    // (1)
    const coamTxt_1=`コーミング必要値=${ok(r_z3_1.req)?r_z3_1.req.toFixed(1):'?'}mm <span style="font-size:10.5px;color:var(--text-dim)">[${r_z3_1.branch}${r_z3_1.inner<0?' (括弧内→0)':''}]</span> 実測=${ok(coaming)?coaming:'未入力'}mm → ${coam_ok_z3_1?'✓':'✗'}`;
    rows+=`<div class="sub-section">
      <div class="sub-section-title">(1) 最強速力 14 kt 以上ルート ${zone3_1_ok?'✅ 充足':'❌ 不足'}</div>
      ${crow(c_spd14,`速力=${spd}kt → ${c_spd14?'14kt以上 ✓':'14kt未満（このルート不可）'}`)}
      ${crow(coam_ok_z3_1,`コーミング条件：${coamTxt_1}`)}
    </div>`;

    // (2)
    const coamTxt_2=`コーミング必要値=${ok(coam2d_req)?coam2d_req.toFixed(1):'?'}mm 実測=${ok(coaming)?coaming:'未入力'}mm → ${coam_ok_z3_2d?'✓':'✗'}`;
    const fuelTxt=`必要=${ok(fuelReq)?fuelReq.toFixed(4):'（出力未入力）'}kL 実際=${ok(fuel)?fuel:'未入力'}kL → ${c_fuel?'✓':'✗'}`;
    const F1bTxt=`必要=${ok(F1b_req)?(F1b_req*1000).toFixed(2):'（Sf/Sa未入力）'}mm 実際=${Fmm.toFixed(0)}mm → ${c_F1b?'✓':'✗'}`;
    rows+=`<div class="sub-section" style="margin-top:8px;">
      <div class="sub-section-title">(2) 最強速力 14 kt 未満ルート ${zone3_2_ok?'✅ 充足':'❌ 不足'}</div>
      ${crow(!c_spd14,`速力=${spd}kt → ${!c_spd14?'14kt未満 ✓（このルート対象）':'14kt以上（ルート(1)を使用）'}`)}
      ${crow(c_spd6,  `a. 速力 ≥ 6kt：${spd}kt → ${c_spd6?'✓':'✗'}`)}
      ${crow(c_F1b,   `b. 乾舷：43+(13-12.38×(Sf+Sa))=${ok(F1b_req)?(F1b_req*1000).toFixed(2):'?'}mm ${F1bTxt}`)}
      ${crow(c_fuel,  `c. 燃料：180×10×PS/(1000²×0.84) ${fuelTxt}`)}
      ${crow(coam_ok_z3_2d,`d. コーミング：225-(112.5/50B)×(F-250B) ${coamTxt_2}`)}
    </div>`;

    html+=zone_block(zone3_ok?'rz-ok':'rz-ng','ZONE 3 — 全沿海',zone3_ok?'✅':'❌',
      `全沿海区域　${zone3_ok?'適用可':'適用不可'}`,
      zone3_ok?'日本の沿岸全域（平水区域含む）を航行できます。':'以下の条件を確認してください。(1)または(2)どちらかを満たせばOKです。',rows);
  }

  // — ZONE 2 2時間限定沿海 —
  html+=zone_block(zone2_ok?'rz-ok':'rz-warn','ZONE 2 — 2時間限定沿海',zone2_ok?'✅':'⚠️',
    `2時間限定沿海　${zone2_ok?'適用可':'条件不足'}`,zone2_desc,zone2_rows);

  // — ZONE 1 陸岸5海里 —
  {
    let rows1='';
    rows1+=crow(zone1_L,`船の長さ L=${L}m → ${zone1_L?'5m未満 ✓':'5m以上（この区分の対象外）'}`);
    if (zone1_L) {
      const coamTxt_z1=`必要値=${ok(r_z1.req)?r_z1.req.toFixed(1):'?'}mm <span style="font-size:10.5px;color:var(--text-dim)">[${r_z1.branch}${r_z1.inner<0?' (括弧内→0)':''}]</span> 実測=${ok(coaming)?coaming:'未入力'}mm → ${coam_ok_z1?'✓':'✗'}`;
      rows1+=crow(coam_ok_z1,`コーミング条件：${coamTxt_z1}`);
    }
    html+=zone_block(zone1_ok?'rz-ok':(zone1_L?'rz-warn':'rz-ng'),
      'ZONE 1 — 陸岸5海里',zone1_ok?'✅':(zone1_L?'⚠️':'❌'),
      `陸岸5海里　${zone1_ok?'適用可':(zone1_L?'コーミング条件不足':'対象外（L≥5m）')}`,
      zone1_ok?'陸岸から5海里（約9.3km）の区域を航行できます。'
        :(zone1_L?'コーミング高さが不足しています。':'L≥5mのため、ZONE 3（全沿海）の条件を確認してください。'),rows1);
  }

  // — サマリー —
  html+=`<div class="card" style="margin-top:4px;">
    <div class="sec-title">適用可能区域サマリー</div>
    <div class="badges">
      <span class="badge ${zone3_ok?'b-ok':'b-ng'}">全沿海</span>
      <span class="badge ${zone2_ok?'b-cond':'b-ng'}">2時間限定沿海</span>
      <span class="badge ${zone1_ok?'b-ok':'b-ng'}">陸岸5海里</span>
    </div>
    <div class="note">
      ※ 本ツールは小型船舶安全規則第7条に基づく参考判定です。実際の検査・申請はJCI（日本小型船舶検査機構）の審査によります。<br>
      ※ コーミング・燃料・舷弧等の未入力項目は「✗」として判定されます。全条件を入力のうえご使用ください。
    </div>
  </div>`;

  content.innerHTML=html;
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}

function crow(ok,text){
  return `<div class="crow"><span class="ci">${ok?'✅':'❌'}</span><span class="ct">${text}</span></div>`;
}
function zone_block(cls,label,icon,title,desc,inner){
  return `<div class="rzone ${cls}">
    <div class="rz-label">${label}</div>
    <div class="rz-title">${icon} ${title}</div>
    <div class="rz-desc">${desc}</div>
    ${inner?`<div class="cond-list">${inner}</div>`:''}
  </div>`;
}

onChange();
</script>
</body>
</html>
